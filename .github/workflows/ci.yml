name: Stage 1 CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: Node ${{ matrix.node }} / ${{ matrix.env }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                include:
                    - {os: macos-latest, node: 22, env: stripped}
                    - {os: macos-latest, node: 22, env: inherit}
                    - {os: macos-latest, node: 24, env: stripped}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: ${{ matrix.node }}
                  package-manager-cache: false
            - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
              with:
                  run_install: false
            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile
            - name: Build
              run: pnpm build
            - name: Diagnose cold Git lookup
              env:
                  DIAG_ENV: ${{ matrix.env }}
              run: pnpm --filter @aiox/adapter-claude exec vitest run --config ../../../vitest.config.ts src/claude-launch.test.ts
            - name: Compare Git executables after first launch
              if: always()
              run: |
                  command -v git
                  ls -l /usr/bin/git
                  /usr/bin/git --version
                  git --version
