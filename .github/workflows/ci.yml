name: Stage 1 CI

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        name: ${{ matrix.os }} / Node ${{ matrix.node }}
        runs-on: ${{ matrix.os }}
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                node: [22, 24]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
              with:
                  node-version: ${{ matrix.node }}
                  package-manager-cache: false
            - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
              with:
                  run_install: false
            - name: Install locked dependencies
              run: pnpm install --frozen-lockfile
            - name: Build packages
        run: pnpm build
      - name: Diagnose existing failures
        shell: bash
        run: |
          cd packages/adapters/claude
          for attempt in {1..30}; do
            echo "DIAG Claude attempt $attempt"
            pnpm exec vitest run --config ../../../vitest.config.ts src/claude.test.ts -t 'keeps only current transcript' || true
          done
          cd ../../../apps/daemon
          pnpm exec vitest run --config ../../vitest.config.ts src/agent-controller.test.ts -t 'Web collaboration timeout revokes' || true
          pnpm exec vitest run --config ../../vitest.config.ts src/daemon.test.ts -t 'publishes SSE snapshots on shell exit' || true
          DIAG_READY=1 pnpm exec vitest run --config ../../vitest.config.ts src/daemon.test.ts -t 'publishes SSE snapshots on shell exit' || true
