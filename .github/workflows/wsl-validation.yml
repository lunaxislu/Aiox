name: WSL2 validation
on:
  push:
    branches: [codex/wsl-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wsl:
    runs-on: windows-2025
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install WSL2 Ubuntu
        shell: pwsh
        run: |
          wsl --version
          wsl --install --distribution Ubuntu-24.04 --web-download --no-launch
          if ($LASTEXITCODE -ne 0) { throw "WSL installation failed: $LASTEXITCODE" }
          wsl --set-version Ubuntu-24.04 2
          if ($LASTEXITCODE -ne 0) { throw "WSL2 conversion failed" }
          wsl --list --verbose
          wsl -d Ubuntu-24.04 -u root -- uname -a
          if ($LASTEXITCODE -ne 0) { throw "WSL2 boot failed" }
      - name: Prepare Linux filesystem and Node
        shell: pwsh
        run: |
          $linuxSource = (wsl -d Ubuntu-24.04 -u root -- wslpath -u "$env:GITHUB_WORKSPACE").Trim()
          $script = @'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y build-essential python3 curl xz-utils ca-certificates git
          useradd -m -s /bin/bash aiox
          mkdir -p /home/aiox/repo /opt/node
          tar -C "$1" --exclude=.git -cf - . | tar -C /home/aiox/repo -xf -
          chown -R aiox:aiox /home/aiox/repo
          cd /tmp
          base="https://nodejs.org/dist/latest-v$2.x"
          curl -fsSLo SHASUMS256.txt "$base/SHASUMS256.txt"
          archive=$(awk '$2 ~ /linux-x64.tar.xz$/ {print $2}' SHASUMS256.txt)
          test -n "$archive"
          curl -fsSLO "$base/$archive"
          grep " $archive$" SHASUMS256.txt | sha256sum -c -
          tar -xJf "$archive" -C /opt/node --strip-components=1
          export PATH="/opt/node/bin:$PATH"
          npm install -g pnpm@10.33.0
          '@
          $script = $script.Replace("`r", "")
          $script | wsl -d Ubuntu-24.04 -u root -- bash -s -- "$linuxSource" '${{ matrix.node }}'
          if ($LASTEXITCODE -ne 0) { throw "Linux environment preparation failed" }
      - name: Run full checks in WSL2
        shell: pwsh
        run: |
          wsl -d Ubuntu-24.04 -u aiox --cd /home/aiox/repo -- bash .github/scripts/verify-wsl.sh
          if ($LASTEXITCODE -ne 0) { throw "WSL validation failed: $LASTEXITCODE" }
