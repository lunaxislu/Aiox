<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>AIOX Stage 2 verification</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                display: flex;
                background: #101214;
                color: #d8dee4;
                font:
                    13px/1.45 ui-sans-serif,
                    system-ui,
                    sans-serif;
            }
            #side {
                display: flex;
                flex-direction: column;
                gap: 12px;
                width: 300px;
                flex: none;
                padding: 12px;
                overflow-y: auto;
                border-right: 1px solid #262b31;
            }
            h1 {
                margin: 0;
                font-size: 13px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                color: #8b949e;
            }
            h2 {
                margin: 0 0 6px;
                font-size: 12px;
                color: #8b949e;
            }
            #status {
                padding: 6px 8px;
                border-radius: 4px;
                background: #1b2027;
                color: #8b949e;
                word-break: break-word;
            }
            #status[data-error="true"] {
                background: #3d1d1d;
                color: #ffb4b4;
            }
            #status:empty,
            .result:empty {
                display: none;
            }
            .result {
                white-space: pre-line;
                overflow-wrap: anywhere;
            }
            .result[data-error="true"] {
                color: #ffb4b4;
            }
            #agents,
            #terminals {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .agent {
                display: block;
                width: 100%;
                padding: 6px 8px;
                border: 1px solid #262b31;
                border-radius: 4px;
                background: #171b20;
                color: inherit;
                font: inherit;
                text-align: left;
                cursor: pointer;
            }
            .agent:disabled {
                cursor: not-allowed;
                opacity: 0.5;
            }
            .agent[aria-pressed="true"] {
                border-color: #4f8cc9;
                background: #1d2b3a;
            }
            .meta {
                display: block;
                color: #8b949e;
                font-size: 11px;
            }
            .empty {
                color: #6b737c;
            }
            #notifications {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin: 0 0 8px;
                padding: 0;
                list-style: none;
            }
            #notifications li {
                padding: 6px 8px;
                border-left: 2px solid #4f8cc9;
                background: #171b20;
            }
            #notifications time {
                display: block;
                color: #8b949e;
                font-size: 11px;
            }
            button {
                font: inherit;
            }
            #read-all {
                padding: 4px 8px;
                border: 1px solid #262b31;
                border-radius: 4px;
                background: #1b2027;
                color: inherit;
                cursor: pointer;
            }
            #stage {
                display: flex;
                flex: 1;
                min-width: 0;
                flex-direction: column;
            }
            #attach {
                padding: 6px 10px;
                border-bottom: 1px solid #262b31;
                color: #8b949e;
            }
            #terminal {
                flex: 1;
                min-width: 0;
                min-height: 0;
                margin: 4px;
                /* Server geometry can exceed a smaller window. Keep the excess
                   inside this pane instead of scrolling the page; xterm owns
                   the vertical scrollbar, so only the width scrolls here. */
                overflow-x: auto;
                overflow-y: hidden;
            }
            #recovery,
            #termination-result {
                margin: 10px;
            }
            #recovery {
                padding: 16px;
                border: 1px solid #654343;
                border-radius: 4px;
            }
            #terminate {
                margin-left: 16px;
                color: #ffb4b4;
                background: #3d1d1d;
            }
        </style>
    </head>
    <body>
        <aside id="side">
            <h1>AIOX</h1>
            <p id="status">daemon API 확인 중…</p>
            <section>
                <h2>Terminals</h2>
                <button id="create-shell" type="button">새 shell</button>
                <p id="create-result" class="result" role="status"></p>
                <div id="terminals"></div>
            </section>
            <section>
                <h2>Agents</h2>
                <div id="agents"></div>
            </section>
            <section>
                <h2>미확인 알림</h2>
                <ul id="notifications"></ul>
                <button id="read-all" type="button">모두 읽음 처리</button>
                <p id="read-result" class="result" role="status"></p>
            </section>
        </aside>
        <main id="stage">
            <div id="attach">Select a terminal or open a new shell.</div>
            <section id="recovery" hidden aria-label="터미널 화면 복구">
                <p id="recovery-error" class="result" role="status"></p>
                <p id="recovery-limit"></p>
                <button id="reconnect" type="button">화면 다시 연결</button>
                <button id="terminate" type="button">강제 종료</button>
                <p>
                    화면 복원 실패로 실행을 종료하지는 않았습니다.<br />화면
                    다시 연결은 기존 실행을 유지하며 연결만 재시도합니다.
                </p>
                <p id="execution-state" role="status"></p>
            </section>
            <p id="termination-result" class="result" role="status"></p>
            <div id="terminal"></div>
        </main>
        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
